# NVIDIA OpenShell policy for the DeepResearch agent.
#
# Network policy is an allowlist: no rule exists for x.com, twitter.com,
# reddit.com, arbitrary result URLs, package indexes, cloud metadata, or LAN
# services. They are therefore denied before a connection is established.

version: 1

filesystem_policy:
  # The image already contains the application and its locked environment.
  # Do not make the whole working directory writable.
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /var/log
    - /dev/urandom
    - /sandbox
  read_write:
    - /sandbox/runs
    - /tmp
    - /dev/null

# Fail closed if the host cannot enforce the filesystem policy.
landlock:
  compatibility: hard_requirement

# Match the non-root identity baked into Dockerfile.openshell.
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  nebius_chat_completions:
    name: nebius-chat-completions-only
    endpoints:
      # ${TOKEN_FACTORY_REGION} is filled in by run.py (default us-central1).
      - host: api.tokenfactory.${TOKEN_FACTORY_REGION}.nebius.com
        port: 443
        protocol: rest
        enforcement: enforce
        credential_binding:
          provider: deep-research-nebius
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
    binaries:
      - path: /usr/local/bin/python3.12

  tavily_search:
    name: tavily-search-only
    endpoints:
      - host: api.tavily.com
        port: 443
        protocol: rest
        enforcement: enforce
        credential_binding:
          provider: deep-research-tavily
        rules:
          - allow:
              method: POST
              path: /search
    binaries:
      - path: /usr/local/bin/python3.12
